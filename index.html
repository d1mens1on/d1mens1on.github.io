<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成都美食热度榜 · 夜蓉味</title>
  <meta name="description" content="成都美食热度榜，深夜食堂排名，用户真实打卡，三个月热度见真章。">
  <meta name="keywords" content="成都美食,热度榜,火锅,串串,探店,打卡">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: #0a0f1f;
      background-image: linear-gradient(rgba(10,15,31,0.7), rgba(10,15,31,0.7)), 
                        url('https://github.com/d1mens1on/d1mens1on.github.io/blob/main/panda-night.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #e1e8f0;
      min-height: 100vh;
      backdrop-filter: blur(2px);
    }
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }
    /* 头部 */
    .header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      backdrop-filter: blur(20px);
      background: rgba(10, 20, 40, 0.6);
      border-radius: 0 0 32px 32px;
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #c1d4ff;
    }
    .header p {
      color: #8899cc;
      margin-top: 0.5rem;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.5rem;
    }
    .nav-btn {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #bdd1ff;
      padding: 0.7rem 1.4rem;
      border-radius: 30px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 0 12px #3b82f680;
    }
    /* 卡片容器 */
    .view {
      display: none;
      animation: fade 0.25s;
    }
    .view.active { display: block; }
    @keyframes fade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
    .card {
      background: rgba(15, 25, 45, 0.75);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .card h3 {
      font-weight: 600;
      font-size: 1.2rem;
      color: #d9e6ff;
    }
    .btn {
      background: #1e3a8a;
      border: none;
      color: white;
      padding: 0.6rem 1.4rem;
      border-radius: 24px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.9rem;
    }
    .btn:hover { background: #2563eb; }
    .btn-outline {
      background: transparent;
      border: 1px solid #3b82f6;
      color: #93b4ff;
    }
    .btn-outline:hover { background: #1e3a8a; }
    .input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 0.7rem 1rem;
      width: 100%;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .input:focus { border-color: #3b82f6; }
    .flex-row {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .badge {
      background: #1e3a8a;
      color: white;
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.8rem;
    }
    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .shop-item:last-child { border-bottom: none; }
    .rank-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffd966;
      min-width: 2rem;
    }
    .gold { color: #ffd966; }
    .silver { color: #c0c0c0; }
    .bronze { color: #cd7f32; }
    /* 分类网格 */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.8rem;
      margin: 1rem 0;
    }
    .category-item {
      background: rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 1.2rem 0.8rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .category-item:hover { background: #1e3a8a; }
    .category-item span { font-size: 2rem; display: block; }
    .mt-2 { margin-top: 0.8rem; }
    .mb-2 { margin-bottom: 0.8rem; }
    .text-right { text-align: right; }
    .text-sm { font-size: 0.8rem; color: #8899cc; }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>🌃 夜蓉味 · 成都美食热度榜</h1>
    <p>深夜里的地道成都味道，由你打卡决定</p>
    <div class="nav" id="mainNav">
      <button class="nav-btn active" data-view="home">🏠 首页</button>
      <button class="nav-btn" data-view="ranking">🔥 热度榜</button>
      <button class="nav-btn" data-view="add">➕ 添加店铺</button>
    </div>
  </div>

  <!-- 视图容器 -->
  <div id="homeView" class="view active">
    <div class="card">
      <h3>📂 美食分类</h3>
      <div class="category-grid" id="categoryGrid"></div>
    </div>
  </div>

  <div id="categoryView" class="view">
    <button class="btn-outline btn mb-2" onclick="switchView('home')">← 返回分类</button>
    <div id="categoryDetail"></div>
  </div>

  <div id="shopView" class="view">
    <button class="btn-outline btn mb-2" onclick="backToCategory()">← 返回列表</button>
    <div id="shopDetail"></div>
  </div>

  <div id="rankingView" class="view">
    <div class="card">
      <h3>🏆 近3个月热度排行榜</h3>
      <p class="text-sm mt-2">基于用户真实打卡次数排序</p>
      <div id="rankingList"></div>
    </div>
  </div>

  <div id="addView" class="view">
    <div class="card">
      <h3>➕ 添加新店铺</h3>
      <div class="mt-2">
        <select id="newCategory" class="input">
          <option value="hotpot">🍲 火锅</option>
          <option value="skewer">🍢 串串香</option>
          <option value="sichuan">🥢 川菜馆</option>
          <option value="snack">🥟 小吃</option>
          <option value="noodle">🍜 面馆/米粉</option>
          <option value="bbq">🍖 烧烤</option>
          <option value="foreign">🌮 异国料理</option>
          <option value="sweet">🍧 甜品饮品</option>
        </select>
      </div>
      <div class="mt-2">
        <input type="text" class="input" id="newShopName" placeholder="输入店铺名称">
      </div>
      <button class="btn mt-2" onclick="addShop()">添加店铺</button>
      <p class="text-sm mt-2">添加后可在分类里找到，并开始打卡。</p>
    </div>
  </div>
</div>

<script>
  // ---------- 数据存储 ----------
  const STORAGE_KEY = 'chengdu_food_data';
  // 初始分类定义
  const DEFAULT_CATEGORIES = {
    hotpot: { name:'火锅', icon:'🍲' },
    skewer: { name:'串串香', icon:'🍢' },
    sichuan: { name:'川菜馆', icon:'🥢' },
    snack: { name:'小吃', icon:'🥟' },
    noodle: { name:'面馆/米粉', icon:'🍜' },
    bbq: { name:'烧烤', icon:'🍖' },
    foreign: { name:'异国料理', icon:'🌮' },
    sweet: { name:'甜品饮品', icon:'🍧' },
  };

  // 全局数据结构
  let appData = {
    shops: {},        // shopId -> { id, name, category, createdAt }
    checkins: {},     // shopId -> [ dateString, ... ]
    comments: {},     // shopId -> [ {text, date}, ... ]
  };

  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        appData = JSON.parse(raw);
      } catch(e) { resetData(); }
    } else {
      resetData();
    }
  }
  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  }
  function resetData() {
    appData = { shops:{}, checkins:{}, comments:{} };
    // 可初始化一些示例店铺，让界面不空
    const samples = [
      { id:'s1', name:'蜀大侠火锅', category:'hotpot' },
      { id:'s2', name:'钢管厂五区小郡肝', category:'skewer' },
      { id:'s3', name:'明婷饭店', category:'sichuan' },
      { id:'s4', name:'洞子口张老二凉粉', category:'snack' },
    ];
    samples.forEach(s => {
      appData.shops[s.id] = { id:s.id, name:s.name, category:s.category, createdAt: Date.now() };
      appData.checkins[s.id] = [];
      appData.comments[s.id] = [];
    });
    saveData();
  }

  // 工具函数：生成唯一ID
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
  }

  // 获取近三个月的日期范围（从今天往前推90天）
  function threeMonthsAgo() {
    const d = new Date();
    d.setDate(d.getDate() - 90);
    return d.toISOString().split('T')[0]; // YYYY-MM-DD
  }

  // 计算某店铺近三个月打卡次数
  function countRecentCheckins(shopId) {
    const checkins = appData.checkins[shopId] || [];
    const start = threeMonthsAgo();
    return checkins.filter(date => date >= start).length;
  }

  // 店铺打卡
  function checkinShop(shopId) {
    if (!appData.shops[shopId]) return;
    const today = new Date().toISOString().split('T')[0];
    if (!appData.checkins[shopId]) appData.checkins[shopId] = [];
    // 简单防重复同天多次，但允许
    appData.checkins[shopId].push(today);
    saveData();
    renderShopDetail(shopId);
  }

  // 添加评论
  function addComment(shopId, text) {
    if (!text.trim()) return;
    if (!appData.comments[shopId]) appData.comments[shopId] = [];
    appData.comments[shopId].push({ text: text.trim(), date: new Date().toISOString() });
    saveData();
    renderShopDetail(shopId);
  }

  // ---------- UI 渲染 ----------
  let currentCategory = null;
  let currentShopId = null;

  function switchView(viewName, categoryKey = null, shopId = null) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

    if (viewName === 'home') {
      document.getElementById('homeView').classList.add('active');
      document.querySelector('[data-view="home"]').classList.add('active');
      renderHome();
    } else if (viewName === 'category') {
      document.getElementById('categoryView').classList.add('active');
      currentCategory = categoryKey;
      renderCategory(categoryKey);
    } else if (viewName === 'shop') {
      document.getElementById('shopView').classList.add('active');
      currentShopId = shopId;
      renderShopDetail(shopId);
    } else if (viewName === 'ranking') {
      document.getElementById('rankingView').classList.add('active');
      document.querySelector('[data-view="ranking"]').classList.add('active');
      renderRanking();
    } else if (viewName === 'add') {
      document.getElementById('addView').classList.add('active');
      document.querySelector('[data-view="add"]').classList.add('active');
    }
  }

  function backToCategory() {
    switchView('category', currentCategory);
  }

  // 首页分类网格
  function renderHome() {
    const grid = document.getElementById('categoryGrid');
    grid.innerHTML = '';
    Object.entries(DEFAULT_CATEGORIES).forEach(([key, cat]) => {
      const div = document.createElement('div');
      div.className = 'category-item';
      div.innerHTML = `<span>${cat.icon}</span><div>${cat.name}</div>`;
      div.onclick = () => switchView('category', key);
      grid.appendChild(div);
    });
  }

  // 分类详情：该分类下的店铺列表
  function renderCategory(catKey) {
    const cat = DEFAULT_CATEGORIES[catKey];
    const shopIds = Object.keys(appData.shops).filter(id => appData.shops[id].category === catKey);
    const detailDiv = document.getElementById('categoryDetail');
    let html = `<h3>${cat.icon} ${cat.name}</h3>`;
    if (shopIds.length === 0) {
      html += '<p class="text-sm mt-2">暂无店铺，快去添加一个吧～</p>';
    } else {
      html += '<div class="mt-2">';
      shopIds.forEach(id => {
        const shop = appData.shops[id];
        html += `
          <div class="shop-item">
            <div>
              <strong>${shop.name}</strong>
              <div class="text-sm">近3月打卡: ${countRecentCheckins(id)} 次</div>
            </div>
            <button class="btn-outline btn" onclick="switchView('shop', '${catKey}', '${id}')">详情</button>
          </div>`;
      });
      html += '</div>';
    }
    detailDiv.innerHTML = html;
  }

  // 店铺详情页：打卡、评论、统计
  function renderShopDetail(shopId) {
    const shop = appData.shops[shopId];
    if (!shop) return;
    const checkins = appData.checkins[shopId] || [];
    const recentCount = countRecentCheckins(shopId);
    const totalCount = checkins.length;
    const comments = appData.comments[shopId] || [];
    const detailDiv = document.getElementById('shopDetail');
    let html = `
      <div class="card">
        <h3>${shop.name}</h3>
        <p class="text-sm">分类：${(DEFAULT_CATEGORIES[shop.category]?.icon || '')} ${DEFAULT_CATEGORIES[shop.category]?.name}</p>
        <div class="flex-row mt-2">
          <div class="badge">🔥 近三月打卡 ${recentCount} 次</div>
          <div class="badge">📋 总打卡 ${totalCount} 次</div>
        </div>
        <div class="mt-2">
          <button class="btn" onclick="checkinShop('${shopId}')">✅ 我今天去了这里</button>
        </div>
      </div>
      <div class="card mt-2">
        <h4>💬 留言 (${comments.length})</h4>
        <div id="commentsList">
          ${comments.slice(-5).map(c => `<div class="text-sm mt-2">🗣 ${c.text} <span style="color:#666;">${new Date(c.date).toLocaleDateString()}</span></div>`).join('')}
        </div>
        <div class="flex-row mt-2">
          <input type="text" class="input" id="commentInput" placeholder="写点评价...">
          <button class="btn" onclick="addComment('${shopId}', document.getElementById('commentInput').value)">发送</button>
        </div>
      </div>`;
    detailDiv.innerHTML = html;
  }

  // 热度排行榜：所有店铺按近三月打卡次数排序
  function renderRanking() {
    const allShops = Object.values(appData.shops);
    const ranked = allShops.map(shop => ({
      ...shop,
      recent: countRecentCheckins(shop.id)
    })).sort((a,b) => b.recent - a.recent);

    const listDiv = document.getElementById('rankingList');
    if (ranked.length === 0) {
      listDiv.innerHTML = '<p class="text-sm mt-2">还没有店铺数据。</p>';
      return;
    }
    let html = '<div class="mt-2">';
    ranked.forEach((shop, idx) => {
      let rankClass = '';
      if (idx === 0) rankClass = 'gold';
      else if (idx === 1) rankClass = 'silver';
      else if (idx === 2) rankClass = 'bronze';
      html += `
        <div class="shop-item">
          <div class="flex-row">
            <span class="rank-number ${rankClass}">#${idx+1}</span>
            <div>
              <strong>${shop.name}</strong>
              <div class="text-sm">${recentText(shop.recent)} 次打卡</div>
            </div>
          </div>
          <button class="btn-outline btn" onclick="switchView('shop', '${shop.category}', '${shop.id}')">详情</button>
        </div>`;
    });
    html += '</div>';
    listDiv.innerHTML = html;
  }

  function recentText(count) {
    return count;
  }

  // 添加新店铺
  function addShop() {
    const name = document.getElementById('newShopName').value.trim();
    const category = document.getElementById('newCategory').value;
    if (!name) return alert('请输入店铺名');
    const shopId = uid();
    appData.shops[shopId] = {
      id: shopId,
      name,
      category,
      createdAt: Date.now()
    };
    appData.checkins[shopId] = [];
    appData.comments[shopId] = [];
    saveData();
    document.getElementById('newShopName').value = '';
    alert('店铺添加成功！');
    switchView('home');
  }

  // 导航事件
  document.getElementById('mainNav').addEventListener('click', e => {
    if (e.target.classList.contains('nav-btn')) {
      const view = e.target.dataset.view;
      switchView(view);
    }
  });

  // 初始加载
  loadData();
  renderHome();
</script>
</body>
</html>
